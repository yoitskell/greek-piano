<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Άσκηση 3 - Greek Piano</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="container">

        <h1>🎹 Άσκηση 3</h1>

        <h2>Ρυθμίσεις</h2>


        <h3>Πλήθος νοτών</h3>
        

        <p>
            <span id="noteCount">10</span> νότες
        </p>


        <input
            id="noteSlider"
            type="range"
            min="5"
            max="30"
            value="10"
            step="1"


        >

        <br>

<label>
    <input id="unlimitedExercise" type="checkbox">
    Απεριόριστη άσκηση
</label>


        <button id="startExercise">
            ▶ Έναρξη Άσκησης
        </button>

    </div>

<script src="js/appSettings.js"></script>
    <script src="js/exercise3-settings.js"></script>

</body>

</html>
