<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greek Piano - Άσκηση 4</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Πάνω μπάρα -->
    <div class="top-bar">

        <button class="exit-button" id="exitButton">
            ✕
        </button>

        <span id="topProgress">
            0 / 8
        </span>

    </div>


    <!-- Κύριο περιεχόμενο -->
    <main class="exercise4-container">

        <h2>Παίξε τη μελωδία!</h2>

        <p id="progress">
            0 / 8
        </p>

        <!-- Εδώ θα εμφανίζονται τα δύο πεντάγραμμα -->
        <div id="staff"></div>

        <!-- Feedback -->
        <p id="feedback"></p>

    </main>


    <!-- Modal εξόδου -->
    <div id="exitModal" class="modal">

        <div class="modalContent">

            <h3>Θέλεις σίγουρα να αποχωρήσεις;</h3>

            <p>
                Η άσκηση θα τερματιστεί και θα επιστρέψεις στο κεντρικό μενού.
            </p>

            <button id="confirmExit">
                Ναι, έξοδος
            </button>

            <button id="cancelExit">
                Όχι, συνέχεια άσκησης
            </button>

        </div>

    </div>


    <!-- VexFlow -->
    <script src="https://unpkg.com/vexflow@4.2.2/build/cjs/vexflow.js"></script>

    <!-- Νότες -->
    <script src="js/notes.js"></script>

    <!-- Ρυθμίσεις εφαρμογής -->
    <script src="js/appSettings.js"></script>

    <!-- Άσκηση 4 -->
    <script src="js/exercise4.js"></script>

    <!-- Προσανατολισμός -->
    <script src="js/orientation.js"></script>

</body>

</html>
