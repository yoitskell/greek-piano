<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Άσκηση 2 - Greek Piano</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="container">

        <h1>🎹 Άσκηση 2</h1>

        <h2>Ρυθμίσεις</h2>


        <h3>Πλήθος νοτών</h3>
        

        <p>
            <span id="noteCount">10</span> νότες
        </p>


        <input
            id="noteSlider"
            type="range"
            min="5"
            max="30"
            value="10"
            step="1"


        >

        <br>

<label>
    <input id="unlimitedExercise" type="checkbox">
    Απεριόριστη άσκηση
</label>

<h3>Οκτάβες</h3>

<label>
    <input type="checkbox" name="octave" value="2">
    2η οκτάβα
</label>

<label>
    <input type="checkbox" name="octave" value="3">
    3η οκτάβα
</label>

<label>
    <input type="checkbox" name="octave" value="4" checked>
    4η οκτάβα
</label>

<label>
    <input type="checkbox" name="octave" value="5">
    5η οκτάβα
</label>

<label>
    <input type="checkbox" name="octave" value="6">
    6η οκτάβα
</label>

<br><br>

        <br><br>

<h3>Ονόματα νοτών</h3>

<label>
    <input
        type="checkbox"
        id="showNoteNames"
    >
    Εμφάνιση ονομάτων πάνω από τις νότες
</label>

<br><br>

        <button id="startExercise">
            ▶ Έναρξη Άσκησης
        </button>

    </div>

<script src="js/appSettings.js"></script>
    <script src="js/exercise2-settings.js"></script>

</body>

</html>
